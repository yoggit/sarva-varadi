name: Demo Tests

run-name: Demo Tests - ${{ inputs.test_framework || 'All Frameworks (Auto)' }}

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      test_framework:
        description: 'Test Framework (leave empty to run all)'
        required: false
        type: choice
        options:
          - ''
          - playwright
          - restassured-testng
          - restassured-junit
          - selenium-testng
          - selenium-cucumber
          - restassured-cucumber

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          npm ci --workspaces --if-present --ignore-scripts

      - name: Clean build artifacts
        run: |
          rm -rf packages/*/dist packages/*/*.tsbuildinfo

      - name: Build core package first
        run: cd packages/core && npm run build

      - name: Build all packages
        run: npm run build

      - name: Pre-populate Playwright history from GitHub Pages
        if: ${{ inputs.test_framework == 'playwright' || inputs.test_framework == '' }}
        continue-on-error: true
        run: |
          echo "📦 Fetching existing Playwright history from GitHub Pages..."
          git clone --depth 1 --branch gh-pages https://github.com/${{ github.repository }}.git gh-pages-old 2>/dev/null || echo "No gh-pages branch yet"
          if [ -d "gh-pages-old/playwright/history" ]; then
            mkdir -p demo-playwright/sarva-report/history/
            # Copy individual run folders only (not runs.json — CLI will rebuild it from folders)
            for dir in gh-pages-old/playwright/history/*/; do
              if [ -d "$dir" ]; then
                folder_name=$(basename "$dir")
                dest="demo-playwright/sarva-report/history/$folder_name"
                if [ ! -d "$dest" ]; then
                  cp -r "$dir" "$dest"
                fi
              fi
            done
            echo "✅ Pre-populated Playwright history"
          else
            echo "ℹ️  No existing Playwright history found (first deployment)"
          fi
          rm -rf gh-pages-old

      - name: Install Playwright browsers
        if: ${{ inputs.test_framework == 'playwright' || inputs.test_framework == '' }}
        run: npx playwright install --with-deps
        working-directory: demo-playwright

      - name: Run Playwright tests
        if: ${{ inputs.test_framework == 'playwright' || inputs.test_framework == '' }}
        run: npm test
        working-directory: demo-playwright
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}

      - name: Generate Selenium, REST Assured & Cucumber demo reports (25-run history)
        if: ${{ inputs.test_framework == 'selenium-testng' || inputs.test_framework == 'restassured-testng' || inputs.test_framework == 'restassured-junit' || inputs.test_framework == 'selenium-cucumber' || inputs.test_framework == 'restassured-cucumber' || inputs.test_framework == '' }}
        run: node scripts/generate-demo-history.js
        continue-on-error: true

      - name: Regenerate trends
        if: always()
        run: node regenerate-trends.js

      - name: Create deployment structure
        if: always()
        run: |
          mkdir -p gh-pages-deploy
          if [ -d "demo-playwright/sarva-report" ]; then
            cp -r demo-playwright/sarva-report gh-pages-deploy/playwright
          fi
          if [ -d "demo-selenium/sarva-report" ]; then
            cp -r demo-selenium/sarva-report gh-pages-deploy/selenium
          fi
          if [ -d "demo-restassured/sarva-report" ]; then
            cp -r demo-restassured/sarva-report gh-pages-deploy/rest-assured
          fi
          if [ -d "demo-restassured-junit/sarva-report" ]; then
            cp -r demo-restassured-junit/sarva-report gh-pages-deploy/rest-assured-junit
          fi
          if [ -d "demo-selenium-cucumber/sarva-report" ]; then
            cp -r demo-selenium-cucumber/sarva-report gh-pages-deploy/selenium-cucumber
          fi
          if [ -d "demo-restassured-cucumber/sarva-report" ]; then
            cp -r demo-restassured-cucumber/sarva-report gh-pages-deploy/restassured-cucumber
          fi

      - name: Create landing page
        if: always()
        run: cp local-gh-pages-test/index.html gh-pages-deploy/index.html && cp local-gh-pages-test/logo.svg gh-pages-deploy/logo.svg

      - name: Upload Sarva-Varadi Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sarva-varadi-reports
          path: gh-pages-deploy/
          retention-days: 30

      - name: Deploy to GitHub Pages
        if: always() && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh-pages-deploy
          keep_files: true  # Preserve existing history folders
